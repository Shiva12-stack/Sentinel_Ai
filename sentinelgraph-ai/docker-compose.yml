services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelgraph
      POSTGRES_USER: sentinelgraph
      POSTGRES_PASSWORD: sentinelgraph_dev_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["sentinelgraph_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelgraph -d sentinelgraph"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sentinelgraph
      DB_USERNAME: sentinelgraph
      DB_PASSWORD: sentinelgraph_dev_only
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  sentinelgraph_pg:
