spring.application.name=SentinelGraph AI
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinelgraph}
spring.datasource.username=${DB_USERNAME:sentinelgraph}
spring.datasource.password=${DB_PASSWORD:sentinelgraph_dev_only}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=always
spring.jackson.serialization.write-dates-as-timestamps=false

server.address=${SERVER_ADDRESS:0.0.0.0}
